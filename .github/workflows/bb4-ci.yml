name: bb4-ci

on:
  workflow_call:
    inputs:
      java-version:
        description: Temurin JDK major version
        type: string
        default: "25"
      gradle-args:
        description: Gradle tasks/args after ./gradlew (no --info by default)
        type: string
        default: build
      publish:
        description: Publish SNAPSHOT on push to main/master (non-PR)
        type: boolean
        default: false
      notify-downstream:
        description: Dispatch upstream-updated to repos listed for this producer
        type: boolean
        default: false
      use-xvfb:
        description: Wrap the Gradle build with xvfb-run -a (Linux GUI tests)
        type: boolean
        default: false
      extra-gradle-args:
        description: Extra Gradle JVM/system args (e.g. -Djava.awt.headless=true)
        type: string
        default: ""
      refresh-on-dispatch:
        description: On repository_dispatch, run clean + --refresh-dependencies
        type: boolean
        default: true
    secrets:
      OSSRH_USERNAME:
        required: false
      OSSRH_PASSWORD:
        required: false
      BB4_DISPATCH_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install xvfb
        if: inputs.use-xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build and test
        run: |
          set -euo pipefail
          EXTRA="${{ inputs.extra-gradle-args }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ "${{ inputs.refresh-on-dispatch }}" = "true" ]; then
            GRADLE_CMD=(./gradlew clean ${{ inputs.gradle-args }} --refresh-dependencies)
          else
            GRADLE_CMD=(./gradlew ${{ inputs.gradle-args }})
          fi
          # shellcheck disable=SC2206
          if [ -n "$EXTRA" ]; then
            # Intentionally unquoted so callers can pass multiple tokens.
            EXTRA_ARR=($EXTRA)
            GRADLE_CMD+=("${EXTRA_ARR[@]}")
          fi
          echo "Running: ${GRADLE_CMD[*]}"
          if [ "${{ inputs.use-xvfb }}" = "true" ]; then
            xvfb-run -a "${GRADLE_CMD[@]}"
          else
            "${GRADLE_CMD[@]}"
          fi

      - name: Publish SNAPSHOT
        if: >-
          inputs.publish
          && github.event_name != 'pull_request'
          && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: ./gradlew publish

      - name: Notify downstream repos
        if: >-
          inputs.notify-downstream
          && github.event_name != 'pull_request'
          && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.BB4_DISPATCH_TOKEN }}
          PRODUCER: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "BB4_DISPATCH_TOKEN is not set; skipping downstream notify"
            exit 0
          fi
          MAP_URL="https://raw.githubusercontent.com/bb4/.github/main/downstream-dispatch.json"
          # Prefer this branch's map when validating PRs against shared-ci; fall back to main after merge.
          if ! curl -fsSL "$MAP_URL" -o /tmp/downstream-dispatch.json; then
            echo "Failed to fetch downstream-dispatch.json from main; trying workflow ref"
            curl -fsSL "https://raw.githubusercontent.com/bb4/.github/shared-ci-bb4-ci/downstream-dispatch.json" \
              -o /tmp/downstream-dispatch.json
          fi
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          mapfile -t DOWNSTREAM < <(jq -r --arg r "$PRODUCER" '.[$r] // [] | .[]' /tmp/downstream-dispatch.json)
          if [ "${#DOWNSTREAM[@]}" -eq 0 ]; then
            echo "No downstream repos configured for $PRODUCER"
            exit 0
          fi
          for repo in "${DOWNSTREAM[@]}"; do
            echo "Notifying $repo"
            gh api "repos/bb4/$repo/dispatches" \
              -f event_type=upstream-updated \
              -f "client_payload[upstream]=$PRODUCER"
          done
